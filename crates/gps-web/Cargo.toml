[package]
name = "gps-web"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wgpu = { version = "30.0.1", features = ["webgpu"] }
glam = { workspace = true }
gps-core = { path = "../gps-core" }
gps-io = { path = "../gps-io" }
gps-render = { path = "../gps-render" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
console_error_panic_hook = "0.1"
